# Build and publish pythomac to PyPI when a GitHub release is published.
#
# Publishing uses PyPI *Trusted Publishing* (OIDC) - no API token is stored in
# the repository. One-time setup on https://pypi.org/manage/project/pythomac/:
#   Publishing -> Add a new publisher -> GitHub
#     owner: hydro-informatics   repository: pythomac
#     workflow name: publish-pypi.yml   environment: pypi
#
# Release procedure:
#   1. bump [project].version in pyproject.toml (and pythomac/__init__.__version__)
#   2. git tag v<version> && push, then create a GitHub release for that tag
#   3. this workflow tests, builds the sdist + wheel, and uploads them to PyPI

name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:   # manual run: builds and checks, but only releases publish

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - run: pytest tests/ -q

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pythomac
    permissions:
      id-token: write   # required for PyPI Trusted Publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
